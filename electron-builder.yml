appId: com.local.carouselstudio
productName: 轮播视频工作台
asar: true
directories:
  output: release
files:
  - dist/**
  - electron/**
  - package.json
  - '!node_modules/**'
mac:
  category: public.app-category.video
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal
  identity: null
win:
  target:
    - target: portable
      arch:
        - x64
    - target: zip
      arch:
        - x64
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
